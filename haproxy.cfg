global
    log stdout format raw local0
    maxconn 40000

defaults
    log global
    mode http

    option httplog
    option dontlognull

    timeout connect 5s
    timeout check 10s
    timeout client  60s
    timeout server  60s
    timeout http-request 15s

# Render's internal service IPs can change during deployments.
# This lets HAProxy refresh the internal DNS results.
resolvers render_dns
    parse-resolv-conf

    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s

    hold valid    10s
    hold other    30s
    hold refused  30s
    hold nx       30s
    hold timeout  30s
    hold obsolete 30s

frontend typesense_frontend
    # Render expects a web service to listen on 0.0.0.0.
    bind 0.0.0.0:10000

    default_backend typesense_backends

backend typesense_backends
    balance roundrobin

    # Typesense /health does not require an API key.
    option httpchk GET /health
    http-check expect status 200

    default-server inter 1s fall 3 rise 2

    server typesense_1 typesense-primary-abcd:8108 \
        check \
        resolvers render_dns \
        init-addr last,libc,none

    server typesense_2 typesense-secondary-efgh:8108 \
        check \
        resolvers render_dns \
        init-addr last,libc,none
